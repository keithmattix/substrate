apiVersion: v1
kind: ServiceAccount
metadata:
  name: ateway-ingress
  namespace: ate-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ateway-ingress
  namespace: ate-system
data:
  config.yaml: |
    config:
      tracing: {}
    gateways:
      http:
        port: 80
      https:
        port: 443
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
    routes:
    - gateways:
      - http
      - https
      policies:
        substrateIngress:
          host: https://api.ate-system.svc
          targetPort: 443
          cacheTtl: 5s
          policies:
            backendTLS:
              root: /run/servicedns.podcert.ate.dev/trust-bundle.pem
      backends:
      - dynamic: {}
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
            insecureHost: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ateway-ingress
  namespace: ate-system
  labels:
    app: ateway-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ateway-ingress
  template:
    metadata:
      labels:
        app: ateway-ingress
    spec:
      serviceAccountName: ateway-ingress
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: agentgateway
        # TODO: replace with official image once general direction is approved
        image: ghcr.io/howardjohn-dev/agentgateway:v0.0.0-substrate.3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
        args:
        - -f
        - /etc/agentgateway/config.yaml
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://opentelemetry-collector.otel-system.svc:4317
        - name: OTEL_SERVICE_NAME
          value: ateway-ingress
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        - name: health
          containerPort: 15021
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 15021
          periodSeconds: 10
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz/ready
            port: 15021
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
          readOnly: true
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: podidentity
          mountPath: /run/podidentity.podcert.ate.dev
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: ateway-ingress
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: servicedns.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              signerName: podidentity.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
          - clusterTrustBundle:
              signerName: podidentity.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: ateway-ingress
  namespace: ate-system
spec:
  type: ClusterIP
  selector:
    app: ateway-ingress
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
